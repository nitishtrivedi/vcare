name: Deploy VCare Dev

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    name: Build and Deploy to dev.vcarepreschool.in

    # IMPORTANT:
    # This tells GitHub to use the secrets/settings
    # stored inside the DEV environment.
    environment: Dev

    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # 1. Checkout the dev branch
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # 2. Setup Node.js
      # ---------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------
      # 3. Install dependencies
      # ---------------------------------------
      - name: Install dependencies
        run: npm install

      # ---------------------------------------
      # 4. Build Angular
      # ---------------------------------------
      - name: Build Angular
        run: npm run build

      # ---------------------------------------
      # Configure Database
      # ---------------------------------------

      - name: Generate config.php from secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          #Configure Gemini for AI Bot
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          sed \
            -e "s|{{DB_HOST}}|$DB_HOST|g" \
            -e "s|{{DB_DATABASE}}|$DB_DATABASE|g" \
            -e "s|{{DB_USERNAME}}|$DB_USERNAME|g" \
            -e "s|{{DB_PASSWORD}}|$DB_PASSWORD|g" \
            -e "s|{{GEMINI_API_KEY}}|$GEMINI_API_KEY|g" \
            public/api/config.php.template > dist/vcare/browser/api/config.php

      # ---------------------------------------
      # 5. Deploy Angular build to Hostinger
      # ---------------------------------------
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 217.21.90.186
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Hostinger FTP from your screenshot
          protocol: ftp
          port: 21

          # Angular production build
          local-dir: ./dist/vcare/browser/

          # Root directory of vcarepreschool.in
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state-v1.01.json
          # Keep remote runtime files that are not managed by Git.
          # Blog images are uploaded by the Admin application
          # directly to Hostinger and must survive deployments.
          exclude: |
            assets/images/blog/**
            **/.ftp-deploy-sync-state.json
