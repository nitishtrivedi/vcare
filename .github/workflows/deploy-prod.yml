name: Deploy VCare Prod

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    name: Build and Deploy to vcarepreschool.in

    # IMPORTANT:
    # This tells GitHub to use the secrets/settings
    # stored inside the DEV environment.
    environment: Prod

    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # 1. Checkout the dev branch
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # 2. Setup Node.js
      # ---------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------
      # 3. Install dependencies
      # ---------------------------------------
      - name: Install dependencies
        run: npm install

      # ---------------------------------------
      # 4. Build Angular
      # ---------------------------------------
      - name: Build Angular
        run: npm run build

        # ---------------------------------------
      # 5. Generate config.php from the template
      # ---------------------------------------
      - name: Generate config.php from secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SUPPORT_MAILBOX_PASSWORD: ${{ secrets.SUPPORT_MAILBOX_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 <<'PY'
          import os, re, pathlib

          template = pathlib.Path('public/api/config.php.template')
          target = pathlib.Path('dist/vcare/browser/api/config.php')

          placeholders = {
              '{{DB_HOST}}': 'DB_HOST',
              '{{DB_DATABASE}}': 'DB_DATABASE',
              '{{DB_USERNAME}}': 'DB_USERNAME',
              '{{DB_PASSWORD}}': 'DB_PASSWORD',
              '{{SUPPORT_MAILBOX_PASSWORD}}': 'SUPPORT_MAILBOX_PASSWORD',
              '{{GEMINI_API_KEY}}': 'GEMINI_API_KEY',
          }

          def php_single_quoted(value):
              # Escape only what a PHP single-quoted string needs.
              return value.replace('\\', '\\\\').replace("'", "\\'")

          content = template.read_text(encoding='utf-8')

          for placeholder, env_name in placeholders.items():
              value = os.environ.get(env_name, '')
              if value == '':
                  raise SystemExit(f'Secret {env_name} is empty. Add it to the Dev environment.')
              content = content.replace(placeholder, php_single_quoted(value))
              print(f'{env_name}: set (length {len(value)})')

          leftover = re.findall(r'\{\{[A-Z_]+\}\}', content)
          if leftover:
              raise SystemExit(f'Unreplaced placeholders remain: {leftover}')

          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(content, encoding='utf-8')
          print('config.php generated at', target)
          PY

      # ---------------------------------------
      # 5. Deploy Angular build to Hostinger
      # ---------------------------------------
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 217.21.90.186
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Hostinger FTP from your screenshot
          protocol: ftp
          port: 21

          # Angular production build
          local-dir: ./dist/vcare/browser/

          # Root directory of vcarepreschool.in
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state-v1.01.json
          # Keep remote runtime files that are not managed by Git.
          # Blog images are uploaded by the Admin application
          # directly to Hostinger and must survive deployments.
          exclude: |
            assets/images/blog/**
            **/.ftp-deploy-sync-state.json
