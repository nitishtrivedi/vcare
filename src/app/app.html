@if (siteUnderDevelopment) {
  <app-under-development />
} @else {
  @if (isAdminArea()) {
    <!-- =====================================================
         ADMIN APPLICATION
         No public Navbar
         No public Footer
         ===================================================== -->

    <main class="admin-app">
      <router-outlet />
    </main>
  } @else {
    <!-- =====================================================
         PUBLIC WEBSITE
         ===================================================== -->

    <app-navbar />

    <main>
      <router-outlet />
    </main>

    <app-footer />
  }
}
