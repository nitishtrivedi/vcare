<section class="vo" id="voices">
  <div class="vo__inner">
    <header class="vo__header" gsapReveal="fade-up">
      <span class="v-eyebrow">Parent voices</span>

      <h2 class="v-h2">What Parents <span class="v-gradient-text">Have To Say</span></h2>
    </header>

    <div class="vo__grid">
      @for (t of testimonials; track t.name) {
        <figure class="vo__card v-glass" gsapReveal="fade-in">
          <span class="vo__mark" aria-hidden="true">“</span>

          <blockquote>
            <p>{{ t.quote }}</p>
          </blockquote>

          <figcaption class="vo__person">
            <span class="vo__avatar" aria-hidden="true">
              {{ t.initials }}
            </span>

            <span>
              <strong>{{ t.name }}</strong>
              <small>{{ t.relation }}</small>
            </span>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
