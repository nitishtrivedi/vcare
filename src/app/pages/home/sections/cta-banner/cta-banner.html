<section class="cx">
  <div class="cx__panel" gsapReveal="zoom-in">
    <div class="cx__glow" aria-hidden="true"></div>

    <div class="cx__content">
      <span class="v-eyebrow">Give Your Child A Head Start</span>

      <h2 class="cx__title">Admissions <span class="v-gradient-text">Are Open</span></h2>

      <p class="cx__sub">
        Come see the campus, meet the teachers, and find the right program for your child.
      </p>

      <ul class="cx__features">
        @for (f of features; track f) {
          <li>{{ f }}</li>
        }
      </ul>

      <div class="cx__actions">
        <a href="tel:+919765076513" class="v-btn v-btn--primary">Call +91 97650 76513</a>
        <a routerLink="/contact" class="v-btn v-btn--ghost">Send an Enquiry</a>
      </div>
    </div>
  </div>
</section>
