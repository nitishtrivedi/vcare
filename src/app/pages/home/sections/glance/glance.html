<section class="stats-band">
  <div class="stats-band__grid">
    @for (stat of stats; track stat.label; let i = $index) {
      <div class="stats-band__circle" vcReveal="pop" [vcRevealDelay]="i * 12.5">
        <span class="stats-band__value" [countUp]="stat.value">
          {{ stat.value }}
        </span>

        <span class="stats-band__label">
          {{ stat.label }}
        </span>
      </div>
    }
  </div>
</section>
