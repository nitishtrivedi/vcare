<section class="media">
  <div class="media__frame">
    <div class="media__header">
      <span class="v-eyebrow media__eyebrow">Life at VCare</span>
      <small class="media__sub">Preschool &amp; Activity Centre, Karvenagar</small>
    </div>

    <video
      #bannerVideo
      class="media__video"
      src="assets/videos/homepage/vcare-media-banner-video.mp4"
      autoplay
      muted
      playsinline
      preload="auto"
      (play)="onPlay()"
      (pause)="onPause()"
      (volumechange)="onVolumeChange()"
      (ended)="onEnded()"
    ></video>

    <div class="media__controls">
      <button
        type="button"
        class="media__btn"
        (click)="togglePlay(); $event.stopPropagation()"
        [attr.aria-label]="isPlaying() ? 'Pause video' : 'Play video'"
      >
        @if (isPlaying()) {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <rect x="6" y="5" width="4" height="14" rx="1" />
            <rect x="14" y="5" width="4" height="14" rx="1" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        }
      </button>

      <button
        type="button"
        class="media__btn"
        (click)="toggleMute(); $event.stopPropagation()"
        [attr.aria-label]="isMuted() ? 'Unmute video' : 'Mute video'"
      >
        @if (isMuted()) {
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M11 5L6 9H3v6h3l5 4V5z" />
            <path d="M16 9l6 6M22 9l-6 6" />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M11 5L6 9H3v6h3l5 4V5z" />
            <path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13" />
          </svg>
        }
      </button>
    </div>
  </div>
</section>
