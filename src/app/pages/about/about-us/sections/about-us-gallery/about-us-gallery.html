<section class="ab-section ab-gal" #root>
  <div class="ab-aura" aria-hidden="true">
    <span class="ab-aura__blob ab-aura__blob--yellow ab-gal__blob"></span>
  </div>

  <div class="ab-wrap">
    <header class="ab-gal__head" gsapReveal="fade-up">
      <p class="ab-eyebrow">Life at V Care</p>
      <h2 class="ab-h2">Photo <span class="ab-grad-text">gallery</span></h2>
    </header>

    <div class="ab-gal__controls">
      <div class="ab-gal__bar" aria-hidden="true">
        <span [style.transform]="'scaleX(' + progress() + ')'"></span>
      </div>

      <div class="ab-gal__buttons">
        <button type="button" class="ab-gal__nav" aria-label="Previous photos" (click)="scroll(-1)">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </button>
        <button type="button" class="ab-gal__nav" aria-label="Next photos" (click)="scroll(1)">
          <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div
      class="ab-gal__track"
      data-tile-track
      #track
      tabindex="0"
      role="region"
      aria-label="Campus photos, scroll horizontally"
      (scroll)="onScroll()"
    >
      @for (p of photos; track p.src; let i = $index) {
        <figure class="ab-gal__tile" data-tile>
          @if (!failed().has(i)) {
            <img [src]="p.src" [alt]="p.alt" loading="lazy" (error)="markFailed(i)" />
          } @else {
            <span class="ab-gal__fallback">
              <i class="fa-regular fa-image" aria-hidden="true"></i>
              Photo coming soon
            </span>
          }
        </figure>
      }
    </div>
  </div>
</section>
