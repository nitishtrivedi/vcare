<section class="gallery">
  <h2 class="section-heading" vcReveal="fade-up">Photo Gallery</h2>
  <span class="rainbow-arc gallery__divider"></span>

  <div class="gallery__wrap" vcReveal="zoom-in">
    <button
      type="button"
      class="gallery__arrow gallery__arrow--prev icon-bounce"
      (click)="scroll(-1)"
      aria-label="Previous photos"
    >
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="M15 6l-6 6 6 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    <div class="gallery__track" #track>
      @for (photo of photos; track photo.src; let i = $index) {
        <div class="gallery__tile">
          @if (!brokenImages.has(i)) {
            <img [src]="photo.src" [alt]="photo.alt" (error)="onImageError(i)" />
          } @else {
            <span class="gallery__icon">
              <svg
                viewBox="0 0 24 24"
                width="28"
                height="28"
                fill="none"
                stroke="#fff"
                stroke-width="1.6"
              >
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <circle cx="9" cy="10" r="1.5" />
                <path d="M21 16l-5.5-5.5L9 17" />
              </svg>
            </span>
            <span class="gallery__label">Gallery photo</span>
          }
        </div>
      }
    </div>
    <button
      type="button"
      class="gallery__arrow gallery__arrow--next icon-bounce"
      (click)="scroll(1)"
      aria-label="Next photos"
    >
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="M9 6l6 6-6 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>

  <!-- <p class="gallery__flag">
    ⚠ Placeholder tiles — swap for real campus &amp; classroom photos before launch.
  </p> -->
</section>
