<section class="parents">
  <div class="parents__inner">
    <div class="parents__intro" vcReveal="fade-up">
      <span class="program-kicker"> Parent perspective </span>

      <h2>
        Because peace of mind
        <span>matters too.</span>
      </h2>
    </div>

    <div class="parents__grid">
      @for (t of testimonials; track t.name; let i = $index) {
        <article
          class="parent-card"
          [style.--accent]="t.accent"
          vcReveal="fade-up"
          [vcRevealDelay]="i * 80"
        >
          <div class="parent-card__quote">“</div>

          <p class="parent-card__text">
            {{ t.quote }}
          </p>

          <div class="parent-card__person">
            <span class="parent-card__avatar">
              {{ t.initials }}
            </span>

            <div>
              <strong>{{ t.name }}</strong>
              <small>{{ t.relation }}</small>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
