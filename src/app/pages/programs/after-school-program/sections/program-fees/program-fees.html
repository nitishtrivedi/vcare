<section class="fees">
  <div class="fees__inner" vcReveal="zoom-in">
    <div class="fees__message">
      <span class="program-kicker"> Simple & clear </span>

      <h2>
        A little more peace
        <span>for parents.</span>
      </h2>

      <p>
        A structured two-hour programme designed to keep children active, learning and cared for
        after their regular school day.
      </p>
    </div>

    <div class="fees__price">
      <span class="fees__label"> Monthly Program </span>

      <strong>
        {{ monthly }}
      </strong>

      <small> / month </small>

      <div class="fees__timing">
        {{ timing }}
      </div>
    </div>
  </div>

  <div class="fees__bottom" vcReveal="fade-up">
    <p>
      {{ note }}
    </p>

    <div class="fees__actions">
      <a routerLink="/contact" class="program-action program-action--primary">
        Make an Enquiry
        <span>↗</span>
      </a>

      <a
        href="assets/docs/vcare-brochure.pdf"
        download
        class="program-action program-action--ghost"
      >
        Download Brochure
      </a>
    </div>
  </div>
</section>
