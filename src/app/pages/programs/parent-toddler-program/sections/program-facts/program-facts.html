<section class="ptt-facts">
  <app-program-aura variant="fresh" />

  <div class="ptt-facts__card" gsapReveal="fade-up">
    <div class="ptt-facts__label">
      <span class="ptt-kicker">The basics</span>
      <strong>Made simple.</strong>
    </div>

    @for (fact of facts; track fact.label; let i = $index) {
      <div class="ptt-fact" gsapReveal="fade-up" [gsapRevealDelay]="(i + 1) * 100">
        <span class="ptt-fact__icon" aria-hidden="true">{{ fact.icon }}</span>
        <div>
          <strong>{{ fact.value }}</strong>
          <small>{{ fact.label }}</small>
        </div>
      </div>
    }

    <a routerLink="/contact" class="ptt-facts__cta">
      Start the conversation <span aria-hidden="true">→</span>
    </a>
  </div>
</section>
