<section class="ptt-why">
  <app-program-aura variant="cool" />

  <div class="ptt-why__inner">
    <div class="ptt-why__heading" gsapReveal="fade-in">
      <span class="ptt-kicker">Why V Care</span>
      <h2>Eight little reasons <span>to begin together.</span></h2>
      <p>
        The Parent Toddler Program is built around meaningful connection, exploration and a gentle
        first step into the wider world.
      </p>
    </div>

    <div class="ptt-why__journey" #journey>
      <div class="ptt-why__track" aria-hidden="true">
        <span class="ptt-why__progress"></span>
      </div>

      @for (point of points; track point.title; let i = $index) {
        <article
          class="ptt-why-point"
          [class.ptt-why-point--right]="i % 2 === 1"
          [style.--accent]="point.accent"
          gsapReveal="fade-in"
          [gsapRevealDelay]="(i % 2) * 80"
        >
          <span class="ptt-why-point__dot">{{ i + 1 }}</span>

          <div class="ptt-why-point__card">
            <small>0{{ i + 1 }}</small>
            <p>{{ point.title }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
