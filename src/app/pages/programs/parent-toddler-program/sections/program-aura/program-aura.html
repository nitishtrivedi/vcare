<div
  #root
  class="aura"
  [class.aura--warm]="variant === 'warm'"
  [class.aura--cool]="variant === 'cool'"
  [class.aura--fresh]="variant === 'fresh'"
  aria-hidden="true"
>
  <span class="aura__blob aura__blob--a"></span>
  <span class="aura__blob aura__blob--b"></span>
  <span class="aura__blob aura__blob--c"></span>
  <span class="aura__grain"></span>
</div>
